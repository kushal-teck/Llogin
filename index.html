<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            overflow: hidden;
            padding: 25px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            border-radius: 6px;
            transition: 0.3s;
        }
        .tab.active {
            background: #4f46e5;
            color: #ffffff;
        }
        .form-box {
            display: none;
        }
        .form-box.active {
            display: block;
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #4f46e5;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #4338ca;
        }
        #msgBox {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tab Switcher -->
    <div class="tabs">
        <div class="tab active" id="signupTab" onclick="switchForm('signup')">Sign Up</div>
        <div class="tab" id="loginTab" onclick="switchForm('login')">Log In</div>
    </div>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form-box active">
        <div class="input-group">
            <label>पूरा नाम (Full Name) *</label>
            <input type="text" id="regName" placeholder="अपना नाम लिखें" required>
        </div>
        <div class="input-group">
            <label>पिता का नाम (Father's Name) *</label>
            <input type="text" id="regFather" placeholder="पिता का नाम लिखें" required>
        </div>
        <div class="input-group">
            <label>जन्म तिथि (Date of Birth) *</label>
            <input type="date" id="regDob" required>
        </div>
        <div class="input-group">
            <label>मोबाइल नंबर (Mobile Number) *</label>
            <input type="tel" id="regMobile" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" required>
        </div>
        <div class="input-group">
            <label>ईमेल (Email ID) *</label>
            <input type="email" id="regEmail" placeholder="example@gmail.com" required>
        </div>
        <div class="input-group">
            <label>पासवर्ड बनाएं (Create Password) *</label>
            <input type="password" id="regPassword" placeholder="कम से कम 6 अक्षर" minlength="6" required>
        </div>
        <button type="submit" class="btn">रजिस्टर करें (Sign Up)</button>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form-box">
        <div class="input-group">
            <label>ईमेल (Email ID) *</label>
            <input type="email" id="loginEmail" placeholder="अपना ईमेल डालें" required>
        </div>
        <div class="input-group">
            <label>पासवर्ड (Password) *</label>
            <input type="password" id="loginPassword" placeholder="अपना पासवर्ड डालें" required>
        </div>
        <button type="submit" class="btn">लॉग इन करें (Log In)</button>
    </form>

    <div id="msgBox"></div>
</div>

<!-- Tab Switching Script -->
<script>
    function switchForm(type) {
        const signupForm = document.getElementById('signupForm');
        const loginForm = document.getElementById('loginForm');
        const signupTab = document.getElementById('signupTab');
        const loginTab = document.getElementById('loginTab');
        const msgBox = document.getElementById('msgBox');
        msgBox.style.display = 'none';

        if (type === 'signup') {
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
        } else {
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
        }
    }

    function showMessage(text, isError = false) {
        const msgBox = document.getElementById('msgBox');
        msgBox.style.display = 'block';
        msgBox.style.backgroundColor = isError ? '#fee2e2' : '#dcfce7';
        msgBox.style.color = isError ? '#dc2626' : '#16a34a';
        msgBox.innerText = text;
    }
</script>

<!-- FIREBASE INTEGRATION SCRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCZHFSDBEWu1q_DsKNclp-aqSX2sULEJic",
  authDomain: "llogin-fbc58.firebaseapp.com",
  projectId: "llogin-fbc58",
  storageBucket: "llogin-fbc58.firebasestorage.app",
  messagingSenderId: "217439993535",
  appId: "1:217439993535:web:951ca8f63cfb35502ad00a",
  measurementId: "G-PNEBMWMWZ7"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. SIGN UP LOGIC (डेटा सेव करने का कोड)
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        showMessage("कृपया प्रतीक्षा करें, डेटा सेव हो रहा है...", false);

        const name = document.getElementById('regName').value;
        const fatherName = document.getElementById('regFather').value;
        const dob = document.getElementById('regDob').value;
        const mobile = document.getElementById('regMobile').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        try {
            // ईमेल और पासवर्ड से अकाउंट बनाना
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // बाकी की डिटेल्स (Name, Father Name, DOB, Mobile) Firestore Database में सेव करना
            await setDoc(doc(db, "users", user.uid), {
                fullName: name,
                fatherName: fatherName,
                dob: dob,
                mobile: mobile,
                email: email,
                createdAt: new Date().toISOString()
            });

            showMessage("✅ साइन अप सफल! आपका सारा डेटा सेव हो गया है।", false);
            document.getElementById('signupForm').reset();
        } catch (error) {
            showMessage("❌ त्रुटि (Error): " + error.message, true);
        }
    });

    // 2. LOGIN LOGIC (लॉग इन करने का कोड)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        showMessage("लॉग इन हो रहा है...", false);

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const userDoc = await getDoc(doc(db, "users", userCredential.user.uid));
            
            if (userDoc.exists()) {
                const data = userDoc.data();
                showMessage(`🎉 स्वागत है, ${data.fullName} (पिता: ${data.fatherName})!`, false);
            } else {
                showMessage("🎉 लॉग इन सफल!", false);
            }
        } catch (error) {
            showMessage("❌ ईमेल या पासवर्ड गलत है!", true);
        }
    });
</script>

</body>
</html>
